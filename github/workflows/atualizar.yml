
name: Atualizar oportunidades

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-oportunidades
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Executar atualização
        run: python scripts/atualizar.py

      - name: Salvar alterações
        run: |
          if [[ -n "$(git status --porcelain data/oportunidades.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/oportunidades.json
            git commit -m "Atualiza oportunidades"
            git push
          else
            echo "Nenhuma alteração encontrada."
          fi
          
